name: Automatic IndexNow & Google WebSub Real-Time Push

on:
  push:
    branches:
      - main
  schedule:
    # Runs automatically once per day at 16:00 UTC (8:00 AM PT) to ensure 100% indexing coverage
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  auto-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Wait 30s for Netlify Edge Propagation on Push
        if: github.event_name == 'push'
        run: sleep 30

      - name: Submit All Sitemap URLs to IndexNow & Google WebSub Hub
        run: python3 scripts/auto_index_all.py
